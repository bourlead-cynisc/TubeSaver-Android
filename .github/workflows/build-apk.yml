name: Build offtube APK
on:
  push:
    branches: [main, feature/offtube-fast-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified current yt-dlp for all Android builds
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            -o app/src/main/res/raw/ytdlp \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp
          echo "e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3  app/src/main/res/raw/ytdlp" | sha256sum -c -
      - name: Bundle locally verified yt-dlp EJS solver (no per-video GitHub download)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            -o /tmp/yt-dlp-ejs.whl \
            https://github.com/yt-dlp/ejs/releases/download/0.8.0/yt_dlp_ejs-0.8.0-py3-none-any.whl
          echo "79300e5fca7f937a1eeede11f0456862c1b41107ce1d726871e0207424f4bdb4  /tmp/yt-dlp-ejs.whl" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          target = "app/src/main/res/raw/ytdlp"
          with zipfile.ZipFile("/tmp/yt-dlp-ejs.whl") as source, zipfile.ZipFile(target, "a") as dest:
              entries = [e for e in source.infolist() if e.filename.startswith("yt_dlp_ejs/")]
              assert entries, "missing EJS files"
              for entry in entries:
                  dest.writestr(entry, source.read(entry))
          import sys
          sys.path.insert(0, target)
          from yt_dlp_ejs.yt.solver import core
          assert len(core()) > 1000, "embedded EJS could not load from zipapp"
          print("Local EJS solver verified inside bundled yt-dlp zipapp")
          PY
      - name: Test yt-dlp info-json replay without a second extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = {
              "id": "cached-video",
              "title": "offtube-cache-smoke",
              "url": "https://example.org/video.mp4",
              "webpage_url": "https://example.org/video.mp4",
              "ext": "mp4",
              "extractor": "generic",
              "extractor_key": "Generic"
          }
          with open("/tmp/offtube-smoke.info.json", "w") as f:
              json.dump(data, f)
          PY
          RESULT="$(python3 app/src/main/res/raw/ytdlp --load-info-json /tmp/offtube-smoke.info.json --simulate --print title)"
          test "$RESULT" = "offtube-cache-smoke"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK ZIP signature and manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" | tail -1
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS_DIR/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Publish ready APK to GitHub Releases
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.5.1"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/offtube-2.5.1.apk
          (cd release && sha256sum offtube-2.5.1.apk > offtube-2.5.1.apk.sha256)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "offtube 2.5.1 — быстрый поиск и локальный EJS" \
              --notes "Offtube 2.5.1: параллельный NewPipe/yt-dlp поиск, первый успешный результат, локальный EJS 0.8.0 и обновление встроенного yt-dlp при переходе со старого APK, без дополнительного обращения к GitHub за EJS во время анализа. Сохранены фоновые загрузки. Цель 5 секунд, но время зависит от сервиса и VPN." \
              --latest
          fi
          gh release upload "$TAG" release/offtube-2.5.1.apk release/offtube-2.5.1.apk.sha256 --clobber
