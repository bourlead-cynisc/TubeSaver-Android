name: Build offtube APK
on:
  push:
    branches: [main, feature/offtube-fast-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified current yt-dlp for all Android builds
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            -o app/src/main/res/raw/ytdlp \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp
          echo "e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3  app/src/main/res/raw/ytdlp" | sha256sum -c -
      - name: Test yt-dlp info-json replay without a second extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = {
              "id": "cached-video",
              "title": "offtube-cache-smoke",
              "url": "https://example.org/video.mp4",
              "webpage_url": "https://example.org/video.mp4",
              "ext": "mp4",
              "extractor": "generic",
              "extractor_key": "Generic"
          }
          with open("/tmp/offtube-smoke.info.json", "w") as f:
              json.dump(data, f)
          PY
          RESULT="$(python3 app/src/main/res/raw/ytdlp --load-info-json /tmp/offtube-smoke.info.json --simulate --print title)"
          test "$RESULT" = "offtube-cache-smoke"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK ZIP signature and manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" | tail -1
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS_DIR/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Publish ready APK to GitHub Releases
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.4.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/offtube-2.4.0.apk
          (cd release && sha256sum offtube-2.4.0.apk > offtube-2.4.0.apk.sha256)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "offtube 2.4.0 — ускоренный поиск без таймаута" \
              --notes "Offtube 2.4.0: поиск качества больше не отменяется после пяти секунд. Движки подготавливаются в фоне, результат yt-dlp повторно используется при скачивании без вторичного запроса к странице, подписанные ссылки кешируются на короткое время с обновлением при истечении. APK прошёл CI-проверки. Время запросов зависит от сайта и VPN. Debug-подпись GitHub Actions может отличаться от предыдущей версии." \
              --latest
          fi
          gh release upload "$TAG" release/offtube-2.4.0.apk release/offtube-2.4.0.apk.sha256 --clobber
