name: Build offtube APK
on:
  push:
    branches: [main, feature/offtube-fast-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Publish ready APK to GitHub Releases
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/offtube-fast-native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0.0-beta.1"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/offtube-v2.0-debug.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "offtube 2.0 Beta — Android APK" \
              --notes "Android APK (debug build) for testing. YouTube uses NewPipeExtractor with native streaming; VK Video and Rutube use yt-dlp fallback. Downloads from real sources have not been verified on physical Android devices. Android VPN is needed if the source is blocked by the network. Only download material you have rights to save." \
              --prerelease
          fi
          gh release upload "$TAG" release/offtube-v2.0-debug.apk --clobber
